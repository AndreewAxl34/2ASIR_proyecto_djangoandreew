{% extends 'plantillabase.html' %}

{% block titulo %}Listado de Administracion{% endblock %}

{% block contenido %}
<form method="POST">
   {% csrf_token %}

   <label class="mt-2">Nombre: </label>
   <div class="col-5 offset-3">
        <input type="text" name="nombre" class="form-control" required>
   </div>

   <label class="mt-3">Sector industrial: </label>
   <div class="col-5 offset-3">
        <input type="text" name="sector_industrial" class="form-control" required>
   </div>

   <label class="mt-3">Domicilio: </label>
   <div class="col-5 offset-3">
        <input type="text" name="domicilio" class="form-control" required>
   </div>

   <label class="mt-3">Teléfono: </label>
   <div class="col-5 offset-3">
        <input type="number" name="telefono" class="form-control" required>
   </div>

   <label class="mt-3">Número de empleados: </label>
   <div class="col-5 offset-3">
        <input type="number" name="numero_empleados" class="form-control" required>
   </div>

   <label class="mt-3">Estructura organizativa: </label>
   <div class="col-5 offset-3">
        <input type="text" name="estructura_organizativa" class="form-control" required>
   </div>

   <label class="mt-3">Tipo de IVA: </label>
   <div class="col-5 offset-3">
        <input type="text" name="tipo_iva" class="form-control" required>
   </div>

   <label class="mt-3">Socios: </label>
   <div class="col-5 offset-3">
        <input type="text" name="socios" class="form-control" required>
   </div>

   <br>
   <div class="mt-3">
         <button type="submit" class="btn btn-primary">Guardar</button>
         <a href="{% url 'listar_administraciones' %}" class="btn btn-secondary">Cancelar</a>
   </div>
</form>
{% endblock %}
