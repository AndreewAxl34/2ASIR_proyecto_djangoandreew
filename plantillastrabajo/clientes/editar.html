{% extends 'plantillabase.html' %}

{% block titulo %}Editar cliente{% endblock %}

{% block contenido %}
<h2>Editar cliente</h2>

<form method="POST">
    {% csrf_token %}

    <label>Nombre: </label>
    <input type="text" name="nombre" value="{{ cliente.nombre }}" required><br>

    <label>Email: </label>
     <input type="email" name="email" value="{{ cliente.email }}" required><br>

    <label>Telefono: </label>
     <input type="text" name="telefono" value="{{ cliente.telefono }}" required><br>

    <label>Direccion: </label>
     <input type="text" name="direccion" value="{{ cliente.direccion }}" required><br>

    <button type="submit">Guardar</button>
    <a href="{% url 'listar_clientes' %}">Cancelar</a>
</form>
{% endblock %}
