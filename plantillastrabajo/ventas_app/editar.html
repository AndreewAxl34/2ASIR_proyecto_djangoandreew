{% extends 'plantillabase.html' %}

{% block titulo %}Editar venta{% endblock %}

{% block contenido %}
<h2 >Editar venta</h2>
<p>Aqui ira el formulario</p>

<form method="POST">
   {% csrf_token %}

   <label class="mt-2">Cliente: </label>
   <div class="col-5 offset-3">
        <select name="cliente" class="form-control" required>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}"
               {% if cliente.id == venta.cliente.id %}selected{% endif %}>
               {{ cliente.nombre }}
            </option>
            {% endfor %}
        </select>
   </div>

    <label class="mt-3">Producto: </label>
 <div class="col-5 offset-3">
        <select name="producto" class="form-control" required>
            {% for producto in productos %}
            <option value="{{ producto.id }}"
               {% if producto.id == venta.producto.id %}selected{% endif %}> 
               {{ producto.nombre }} - {{ producto.precio }}
          </option>
            {% endfor %}
        </select>
  </div>

   <label class="mt-3">Cantidad: </label>
  <div class="col-5 offset-3">
       <input type="number" name="cantidad" class="form-control" min="1" value="{{ venta.cantidad }}" required>
  </div>

  <label class="mt-3">Fecha de la venta: </label>
  <div class="col-5 offset-3">
       <input type="date" name="fecha" value="{{ venta.fecha|date:'Y-m-d' }}" class="form-control" required>
  </div>
    
    <br>
    <button type="submit" class="btn btn-primary">Actualizar</button>
    <a href="{% url 'listar_ventas' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
