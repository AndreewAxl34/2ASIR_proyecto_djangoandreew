{% extends 'plantillabase.html' %}

{% block titulo %}Crear Ventas{% endblock %}

{% block contenido %}
<h2>Crear una nueva venta</h2>
<p>Aqui ira el formulario</p>

<form method="POST">
   {% csrf_token %}

   <label class="mt-2">Cliente: </label>
   <div class="col-5 offset-3">
        <select name="cliente" class="form-control" required>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}">{{ cliente.nombre }}</option>
            {% endfor %}
        </select>
   </div>

    <label class="mt-3">Producto: </label>
 <div class="col-5 offset-3">
        <select name="producto" class="form-control" required>
            {% for producto in productos %}
            <option value="{{ producto.id }}">{{ producto.nombre }} - {{ producto.precio }}</option>
            {% endfor %}
        </select>
  </div>

   <label class="mt-3">Cantidad: </label>
  <div class="col-5 offset-3">
       <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
  </div>

  <label class="mt-3">Fecha de la venta: </label>
  <div class="col-5 offset-3">
       <input type="date" name="fecha" class="form-control" required>
  </div>

    <br>
    <div class="mt-3">
         <button type="submit" class="btn btn-primary">Guardar</button>
         <a href="{% url 'listar_ventas' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
