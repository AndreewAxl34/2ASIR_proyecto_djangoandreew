<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block titulo %}Mi Proyecto de DJANGO {% endblock %}</title>
    {% load static %}
    <!--Este sera el enlace para el BOOTSTARP CSS--->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Este enlace ira hacia la carpeta css donde se enceuntra las caracterisca---->
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
<!--Cabecera del proyecto---->
<header>
    <h1>Trabajo de DJANGO 2ASIR: Word-Tech</h1>
</header>
<!---Final de la cabecera del proyecto-->
<!--Cominezo de la lista de opciones--->
<nav>
    <a href="/" class="boton">Inicios</a>
    <a href="/configuracion/" class="boton">Configuracion</a>
    <a href="/productos/" class="boton">Producto</a>
    <a href="/secciones/"  class="boton">Secciones</a>
    <a href="/clientes/"  class="boton">Clientes</a>
    <a href="/ventas/"  class="boton">Ventas</a>
</nav>
<!--FInal del a lista de secciones--->
<!--cuerpo del proyecto-->
<div class="cuerpo ">
    <div class="row">
        <!--parte lateral del cuerpo-->
        <aside class="lateral col-3">
            <h3>Menu lateral</h3>
            <br>
              <a href="/" class="boton_secundario">Inicios</a>
              <a href="/configuracion/" class="boton_secundario">Configuracion</a>
              <a href="/productos/" class="boton_secundario">Producto</a>
              <a href="/secciones/"  class="boton_secundario">Secciones</a>
              <a href="/clientes/"  class="boton_secundario">Clientes</a>
              <a href="/ventas/"  class="boton_secundario">Ventas</a>
        </aside>
        <!--parte lateral del cuerpo-->
        <main class="contenido col-9">
            {% block contenido %}
            {% endblock %}
        </main>
    </div>
</div>
<!--Final del cuerpo-->
<!--Pie de la pagina--->
<!--Final del pie de la pagina-->
<footer>
    Pagina diseñada por: Andreew Axl Govea Loayza
</footer>
<!---SCriopt para las secciones despegables-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
