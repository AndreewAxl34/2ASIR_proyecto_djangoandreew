{% extends 'plantillabase.html' %}

{% block titulo %}Crear Productos{% endblock %}

{% block contenido %}
<h2>Crear un nuevo producto</h2>
<p>Aqui ira el formulario</p>

<form method="POST">
   {% csrf_token %}

   <label class="mt-2">Nombre: </label>
   <div class="col-5 offset-3">
        <input type="text" name="nombre" class="form-control" required>
   </div>

    <label class="mt-3">Precio: </label>
 <div class="col-5 offset-3">
       <input type="number" step="0.01" name="precio" class="form-control" required>
  </div>

   <label class="mt-3">Stock: </label>
  <div class="col-5 offset-3">
       <input type="number" name="stock" class="form-control" required>
  </div>

   <label class="mt-3">Descripcion: </label>
  <div class="col-5 offset-3">
       <input type="text" name="descripcion" class="form-control" required>
  </div>

    <label class="mt-3">Seccion: </label>
   <div class="col-5 offset-3">
    <select name="seccion" class="form-control" required>
        {% for s in secciones %}
          <option value="{{ s.id }}">{{ s.nombre }}</option>
        {% endfor %}
    </select>
     </div>
    
    <br>
    <div class="mt-3">
         <button type="submit" class="btn btn-primary">Guardar</button>
         <a href="{% url 'listar_productos' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
